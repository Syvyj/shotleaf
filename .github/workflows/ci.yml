name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version && swift --version
      - uses: actions/cache@v4
        with:
          path: ShotleafKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('ShotleafKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Build the package
        run: swift build --package-path ShotleafKit
      - name: Test
        run: swift test --package-path ShotleafKit
      # Release and arm64, as scripts/make-release.sh builds it (the package above is built for debugging).
      - name: Build the app
        run: xcodebuild -project Shotleaf.xcodeproj -scheme Shotleaf -configuration Release ARCHS=arm64 ENABLE_DEBUG_DYLIB=NO CODE_SIGNING_ALLOWED=NO -skipMacroValidation -derivedDataPath build/CI -quiet build
